name: Build CLI and desktop packages

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to publish the artifacts to (for example v0.1.3). Leave empty to only keep the workflow artifacts."
        required: false
        default: ""
  push:
    branches:
      - main
      - "arena/**"
    tags:
      - "v*"

permissions:
  contents: write

env:
  APPIMAGE_EXTRACT_AND_RUN: 1
  APPIMAGE_RUNTIME_FILE: /tmp/runtime-x86_64

jobs:
  linux-packages:
    name: Linux binaries, Debian packages and AppImages
    runs-on: ubuntu-22.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            dpkg-dev \
            fakeroot \
            desktop-file-utils \
            zsync \
            libfontconfig1-dev \
            libx11-xcb-dev \
            libxcb1-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libwayland-dev

      - name: Install appimagetool
        run: |
          curl --fail --location --silent --show-error \
            --output /tmp/appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          curl --fail --location --silent --show-error \
            --output "$APPIMAGE_RUNTIME_FILE" \
            https://github.com/AppImage/type2-runtime/releases/download/continuous/runtime-x86_64
          chmod +x /tmp/appimagetool "$APPIMAGE_RUNTIME_FILE"
          sudo install -m 0755 /tmp/appimagetool /usr/local/bin/appimagetool
          appimagetool --version

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check desktop UI contract
        run: node --test tests/desktop_ui.test.mjs

      - name: Build CLI
        run: cargo build --locked --release -p schema-pathfinder --bin schema-pathfinder

      - name: Build desktop GUI
        run: cargo build --locked --release -p schema-pathfinder-desktop

      - name: Build Debian packages
        run: |
          node scripts/build_deb.mjs
          node scripts/build_desktop_deb.mjs

      - name: Build AppImages
        run: |
          node scripts/build_appimage.mjs
          node scripts/build_desktop_appimage.mjs

      - name: Inspect Debian packages
        run: |
          for package in dist/*.deb; do
            echo "::group::$package"
            dpkg-deb --info "$package"
            dpkg-deb --contents "$package"
            echo "::endgroup::"
          done

      - name: Verify Debian packages install
        run: |
          sudo apt-get install --yes ./dist/schema-pathfinder_*_amd64.deb
          sudo apt-get install --yes ./dist/schema-pathfinder-desktop_*_amd64.deb
          schema-pathfinder --tables --fixture /opt/schema-pathfinder/fixtures/postgres/dressshot_seed_fk_edges.json
          test -x /usr/bin/schema-pathfinder-desktop

      - name: Verify AppImages
        run: |
          chmod +x dist/*.AppImage
          ./dist/schema-pathfinder-*-x86_64.AppImage --tables --fixture fixtures/postgres/dressshot_seed_fk_edges.json
          file dist/schema-pathfinder-desktop-*-x86_64.AppImage

      - name: Collect release artifacts
        run: |
          mkdir -p artifacts
          cp target/release/schema-pathfinder artifacts/schema-pathfinder-linux-x86_64
          cp target/release/schema-pathfinder-desktop artifacts/schema-pathfinder-desktop-linux-x86_64
          chmod +x artifacts/schema-pathfinder-linux-x86_64 artifacts/schema-pathfinder-desktop-linux-x86_64
          tar -C artifacts -czf artifacts/schema-pathfinder-linux-x86_64.tar.gz \
            schema-pathfinder-linux-x86_64 \
            schema-pathfinder-desktop-linux-x86_64
          cp dist/*.deb artifacts/
          cp dist/*.AppImage artifacts/
          sha256sum artifacts/* > artifacts/SHA256SUMS
          ls -lh artifacts/

      - name: Upload binaries and packages to workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: schema-pathfinder-linux-packages
          path: artifacts/
          if-no-files-found: error
          retention-days: 14

      - name: Resolve release tag
        id: release
        env:
          INPUT_TAG: ${{ inputs.release_tag }}
        run: |
          if [ "${GITHUB_REF}" != "${GITHUB_REF#refs/tags/}" ]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${INPUT_TAG}" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish artifacts to the GitHub release
        if: steps.release.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Schema Pathfinder $TAG" \
              --generate-notes
          fi
          gh release upload "$TAG" artifacts/* --repo "$GITHUB_REPOSITORY" --clobber
